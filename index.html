
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General47 - EUR/USD RSI Signal</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            text-align: center;
        }
        h1, h2, h3 {
            margin: 10px 0;
        }
        .signal {
            color: {"#00ff00" if signal == "CALL (BUY)" else "#ff0000" if signal == "PUT (SELL)" else "#ffff00"};
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📊 General47</h1>
        <h2>EUR/USD - 1min RSI Signal</h2>
        <h3>Current RSI: 28.4</h3>
        <div class="signal">CALL (BUY)</div>
        <p>⏱ Time: 10:19 AM</p>
    </div>
</body>
</html>
